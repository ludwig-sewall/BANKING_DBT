version: 2
models:
- name: int_plant_360__production
  description: Plant output and OEE over the year.
  columns:
  - name: plant_key
    data_tests:
    - unique
    - not_null
- name: int_plant_360__maintenance
  description: Plant failures, downtime and maintenance cost.
  columns:
  - name: plant_key
    data_tests:
    - unique
    - not_null
- name: int_plant_360__quality
  description: Plant quality KPIs over the year.
  columns:
  - name: plant_key
    data_tests:
    - unique
    - not_null
- name: int_plant_monthly__unioned
  description: Monthly plant KPIs from the three systems stacked into one shape before pivoting.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      description: 'Grain: one row per source_system, plant_key, activity_month.'
      arguments:
        combination_of_columns:
        - source_system
        - plant_key
        - activity_month
  columns:
  - name: plant_key
    data_tests:
    - not_null
  - name: source_system
    data_tests:
    - accepted_values:
        arguments:
          values:
          - production
          - maintenance
          - quality
- name: int_machine_360__joined
  description: MES machines joined to CMMS equipment on the shared machine serial.
  columns:
  - name: machine_id
    data_tests:
    - unique
    - not_null
