version: 2
models:
- name: dim_plant_360
  description: Public plant 360 across production, maintenance and quality.
  config:
    access: public
    contract:
      enforced: true
  semantic_model:
    enabled: true
  agg_time_dimension: as_of_date
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 10
        max_value: 10
  columns:
  - name: plant_id
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - unique
    - not_null
    - dbt_expectations.expect_column_values_to_match_regex:
        arguments:
          regex: ^PL-[0-9]{2}$
    entity:
      type: primary
      name: plant
  - name: plant_name
    data_type: varchar
  - name: country
    data_type: varchar
    dimension:
      type: categorical
  - name: production_status
    data_type: varchar
  - name: maintenance_status
    data_type: varchar
  - name: quality_status
    data_type: varchar
    dimension:
      type: categorical
  - name: units_produced
    data_type: integer
    constraints:
    - type: not_null
  - name: scrap_rate
    data_type: numeric(18,4)
    data_tests:
    - platform.in_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: avg_oee
    data_type: numeric(18,4)
    data_tests:
    - platform.in_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: failure_count
    data_type: integer
    constraints:
    - type: not_null
  - name: unplanned_downtime_hours
    data_type: numeric(18,2)
    constraints:
    - type: not_null
  - name: maintenance_cost
    data_type: numeric(18,2)
    constraints:
    - type: not_null
  - name: avg_first_pass_yield
    data_type: numeric(18,4)
    data_tests:
    - platform.in_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: avg_defects_ppm
    data_type: integer
  - name: complaint_count
    data_type: integer
    constraints:
    - type: not_null
  - name: complaint_credits
    data_type: numeric(18,2)
    constraints:
    - type: not_null
  - name: is_certificate_expired
    data_type: boolean
    constraints:
    - type: not_null
  - name: domain_count
    data_type: integer
    constraints:
    - type: not_null
  - name: as_of_date
    data_type: date
    constraints:
    - type: not_null
    granularity: day
    dimension:
      type: time
  metrics:
  - name: plants
    description: Plants on the plant 360.
    label: Plants
    type: simple
    agg: count
    expr: '1'
  - name: units_produced
    description: Sum of units_produced.
    label: Units produced
    type: simple
    agg: sum
    expr: units_produced
  - name: maintenance_cost
    description: Sum of maintenance_cost.
    label: Maintenance cost
    type: simple
    agg: sum
    expr: maintenance_cost
  - name: complaint_credits
    description: Sum of complaint_credits.
    label: Complaint credits
    type: simple
    agg: sum
    expr: complaint_credits
- name: fct_plant_monthly
  description: Public monthly plant KPIs across the three systems.
  config:
    access: public
    contract:
      enforced: true
  semantic_model:
    enabled: true
  agg_time_dimension: activity_month
  columns:
  - name: plant_month_id
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - unique
    - not_null
    entity:
      type: primary
      name: plant_month
  - name: plant_id
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_plant_360')
          field: plant_id
    entity:
      type: foreign
      name: plant
  - name: activity_month
    data_type: date
    constraints:
    - type: not_null
    granularity: month
    dimension:
      type: time
  - name: units_produced
    data_type: integer
    constraints:
    - type: not_null
    data_tests:
    - platform.sums_match:
        description: Cross-project reconciliation with the production project's run fact.
        arguments:
          compare_model: ref('BANKING_PRODUCTION', 'fct_production_runs')
          compare_column: units_produced
  - name: scrap_units
    data_type: integer
    constraints:
    - type: not_null
  - name: oee
    data_type: numeric(18,4)
  - name: downtime_hours
    data_type: numeric(18,2)
    constraints:
    - type: not_null
  - name: maintenance_cost
    data_type: numeric(18,2)
    constraints:
    - type: not_null
  - name: first_pass_yield
    data_type: numeric(18,4)
  - name: complaint_count
    data_type: integer
    constraints:
    - type: not_null
  metrics:
  - name: monthly_units_produced
    description: Sum of units_produced.
    label: Monthly units
    type: simple
    agg: sum
    expr: units_produced
  - name: monthly_downtime_hours
    description: Sum of downtime_hours.
    label: Downtime hours
    type: simple
    agg: sum
    expr: downtime_hours
- name: fct_machine_reliability
  description: >-
    Public machine reliability: OEE from production with MTBF/MTTR and cost from maintenance.
  config:
    access: public
    contract:
      enforced: true
  columns:
  - name: machine_id
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - unique
    - not_null
  - name: plant_id
    data_type: varchar
    constraints:
    - type: not_null
  - name: machine_type
    data_type: varchar
    constraints:
    - type: not_null
  - name: age_years
    data_type: integer
    constraints:
    - type: not_null
  - name: equipment_id
    data_type: varchar
  - name: criticality
    data_type: varchar
  - name: units_produced
    data_type: integer
    constraints:
    - type: not_null
  - name: avg_oee
    data_type: numeric(18,4)
  - name: aborted_runs
    data_type: integer
    constraints:
    - type: not_null
  - name: failure_count
    data_type: integer
    constraints:
    - type: not_null
  - name: mean_days_between_failures
    data_type: numeric(18,1)
  - name: mean_hours_to_repair
    data_type: numeric(18,2)
  - name: maintenance_cost
    data_type: numeric(18,2)
    constraints:
    - type: not_null
  - name: maintenance_cost_per_unit
    data_type: numeric(18,4)
  - name: is_unmaintained
    description: No CMMS record (e.g. outsourced maintenance).
    data_type: boolean
    constraints:
    - type: not_null
- name: dim_plant_scorecards
  description: 'Public scorecard for running plants: ranks, risk flags and tier.'
  config:
    access: public
    contract:
      enforced: true
  columns:
  - name: plant_id
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('dim_plant_360')
          field: plant_id
  - name: oee_rank
    data_type: integer
    constraints:
    - type: not_null
  - name: quality_rank
    data_type: integer
    constraints:
    - type: not_null
  - name: is_oee_risk
    data_type: boolean
    constraints:
    - type: not_null
  - name: is_quality_risk
    data_type: boolean
    constraints:
    - type: not_null
  - name: scorecard_tier
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - accepted_values:
        arguments:
          values:
          - gold
          - silver
          - bronze
          - watchlist
- name: time_spine_daily
  description: Day spine for the Semantic Layer, built with the platform date_spine macro.
  config:
    access: protected
  time_spine:
    standard_granularity_column: date_day
  columns:
  - name: date_day
    description: Calendar day.
    data_type: date
    data_tests:
    - unique
    - not_null
    granularity: day
unit_tests:
- name: test_scorecard_tiers
  model: dim_plant_scorecards
  given:
  - input: ref('dim_plant_360')
    rows:
    - plant_id: A
      production_status: running
      avg_oee: 0.8
      avg_first_pass_yield: 0.95
      failure_count: 1
      complaint_count: 0
    - plant_id: B
      production_status: running
      avg_oee: 0.5
      avg_first_pass_yield: 0.7
      failure_count: 20
      complaint_count: 9
    - plant_id: C
      production_status: closed
      avg_oee: 0.7
      avg_first_pass_yield: 0.9
      failure_count: 2
      complaint_count: 1
  expect:
    rows:
    - plant_id: A
      oee_rank: 1
      scorecard_tier: gold
      is_quality_risk: false
    - plant_id: B
      oee_rank: 2
      scorecard_tier: watchlist
      is_quality_risk: true
